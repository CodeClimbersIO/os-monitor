[package]
name = "os-monitor"
version = "0.4.9"
edition = "2021"
authors = ["Paul Hovley <rphovley@gmail.com>"]
description = "OS level monitor for tracking window focus and input events"
license = "MIT"
repository = "https://github.com/CodeClimbersIO/os-monitor"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.8"
once_cell = "1.18"
ctrlc = "3.4.5"
log = "0.4.25"
env_logger = "0.11.6"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "io-util", "net", "time"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"
url = "2.4"

# Linux-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]
x11 = "2.21"
evdev = "0.13.2"
sysinfo = "0.30"
libc = "0.2"
nix = { version = "0.30", features = ["event"] }

[build-dependencies]
cc = "1.0"
pkg-config = "0.3"
